name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    # 只跑项目实际支持的两个平台：Windows 10/11 和 macOS。
    # Linux 不是支持目标（没有系统 OCR、启动脚本也只有 .bat / .command 两套）。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 跑测试
        run: python -X utf8 -m pytest -q
        env:
          PYTHONIOENCODING: utf-8

      # 走一遍真实用户路径：不配置任何东西，直接初始化 → 写演示数据 → 离线出报
      - name: 冒烟：初始化 + 演示数据 + 离线出报
        run: |
          python -X utf8 -m bureau init
          python -X utf8 -m bureau demo seed
          python -X utf8 -m bureau run --demo --dry-run
        env:
          PYTHONIOENCODING: utf-8

      - name: 冒烟：体检
        run: python -X utf8 -m bureau doctor
        env:
          PYTHONIOENCODING: utf-8
